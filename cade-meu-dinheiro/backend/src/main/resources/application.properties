# Banco padrão: H2 em arquivo (./data), modo PostgreSQL. Para PostgreSQL real, defina as variáveis
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:h2:file:./data/cade_meu_dinheiro;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE

spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/schema.sql
spring.sql.init.continue-on-error=false

logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.org.springframework.boot.sql.init=DEBUG

server.port=${PORT:8080}
app.secret=${APP_SECRET:}
app.dados-teste=${DADOS_TESTE:true}


spring.jpa.defer-datasource-initialization=false