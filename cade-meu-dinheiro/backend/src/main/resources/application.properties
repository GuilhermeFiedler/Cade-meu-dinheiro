# Banco padrao: H2 em arquivo (./data), modo PostgreSQL. Para PostgreSQL real, defina as variaveis
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:h2:file:./data/cade_meu_dinheiro;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE

spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/schema.sql
spring.sql.init.continue-on-error=false

server.port=${PORT:8080}
app.secret=${APP_SECRET:}

# Seguranca (detalhes em docs/06-seguranca.md)
# Usuario de teste: desligado por padrao. O perfil "dev" liga (application-dev.properties).
app.dados-teste=${DADOS_TESTE:false}
# Validade da sessao em horas (168 = 7 dias, RNF12)
app.sessao-horas=${SESSAO_HORAS:168}
# Dominios do frontend aceitos por CORS, separados por virgula. Vazio = CORS desligado.
app.cors-origens=${CORS_ORIGENS:}
# Limite de tentativas: falhas de login por e-mail, cadastros por IP e janela de tempo
app.limite.login-falhas=${LIMITE_LOGIN_FALHAS:5}
app.limite.registros=${LIMITE_REGISTROS:20}
app.limite.janela-minutos=${LIMITE_JANELA_MIN:15}

spring.jpa.defer-datasource-initialization=false
